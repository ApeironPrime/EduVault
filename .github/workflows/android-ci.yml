name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Build backend Functions
        working-directory: functions
        shell: pwsh
        run: |
          npm ci
          npm run build
      - name: Verify phase 0 safeguards, lint, tests and debug build
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .\scripts\verify-phase-0.ps1
